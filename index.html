<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>মাধ্যমিক ও উচ্চ মাধ্যমিক পরীক্ষার ফলাফল</title>
<style>
*{box-sizing:border-box}
body{font:18px/1.6 'Nirmala UI',sans-serif;max-width:820px;margin:0 auto;padding:40px 20px;background:#edf6f5;color:#173b3a}
main{min-width:0;background:white;padding:30px;border-radius:16px;overflow-wrap:anywhere}
h1{font-size:clamp(1.5rem,5vw,2.25rem);line-height:1.35;margin-top:0}
form{display:grid;gap:16px;margin:24px 0}
label{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,290px);gap:8px 20px;align-items:center;min-width:0}
select,input,button{font:inherit;padding:10px;min-width:0;max-width:100%}
input,select{width:100%;background:#fff;color:inherit;border:1px solid #8ba9a6;border-radius:6px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.upload-option{text-align:center;margin-top:16px}
.upload-option p{margin:8px 0;font-size:0.9em}
button{cursor:pointer;background:#08766b;color:white;border:0;border-radius:6px;white-space:normal}
button:hover{background:#065d54;box-shadow:0 3px 8px #173b3a33}
button:disabled{cursor:not-allowed;opacity:0.6;box-shadow:none}
button:focus-visible{background:#065d54}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d99300;outline-offset:3px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.6 monospace}
#ocr-progress{font-size:.9em}
@media(max-width:600px){body{padding:16px 10px}main{padding:20px 16px;border-radius:12px}label{grid-template-columns:minmax(0,1fr);gap:6px}.actions{flex-direction:column}.actions button{width:100%;min-height:48px}}
</style>
<main><h1 style="text-align:center">মাধ্যমিক ও উচ্চ মাধ্যমিক পরীক্ষার ফলাফল</h1>
<section id="entry-step">
<div class="actions"><button id="connect-site" type="button">Connect to Site</button></div><p id="connection-status" role="status" aria-live="polite"></p>
<form><label>Examination <select name="exam" required disabled><option value="">Connect to Site</option></select></label>
<label>Year <select name="year" required disabled><option value="">Connect to Site</option></select></label>
<label>Board <select name="board" required disabled><option value="">Connect to Site</option></select></label>
<label>Roll <input name="roll" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6"></label><label>Registration <input name="registration" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10"></label>
</form>
<div class="actions"><button id="fill" type="button">Submit</button><button id="reset" type="button">Reset</button></div>
<div class="upload-option"><button id="choose-card" type="button">অথবা রেজিস্ট্রেশন কার্ড আপলোড করুন</button>
<input id="card-file" type="file" accept="image/jpeg,image/png,image/bmp,application/pdf,.pdf" hidden>
<p id="card-status" role="status"></p><progress id="ocr-progress" max="1" value="0" hidden aria-label="কার্ড পড়ার অগ্রগতি"></progress><button id="cancel-ocr" type="button" hidden>কার্ড পড়া বন্ধ করুন</button></div>
<pre id="status" role="status" aria-live="polite"></pre></section>
<section id="captcha-step" hidden aria-labelledby="captcha-heading">
<h2 id="captcha-heading" tabindex="-1">CAPTCHA যাচাই</h2>
<pre id="submission-summary"></pre>
<p id="captcha-status" role="status" aria-live="polite"></p>
<p>CAPTCHA একই official tab-এ নিজে পূরণ করুন। এখানে cookie বা CAPTCHA কপি করা হয় না।</p>
<div class="actions"><button id="focus-official" type="button">Official CAPTCHA tab খুলুন</button><button id="official-submit" type="button">ফলাফল দেখুন</button><button id="refresh-official" type="button">Official উত্তর দেখুন</button><button id="back-entry" type="button">আগের পৃষ্ঠায় ফিরুন</button></div>
<pre id="official-response" role="status"></pre>
</section></main>
<script src="vendor/tesseract.min.js"></script><script src="browser-bridge.js?v=public-3"></script><script src="card-parser.js"></script><script type="module" src="app.js?v=public-1"></script></html>
